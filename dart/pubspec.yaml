name: apiverve_numbertowords
description: "Number to Words is a number to words API that converts numeric values into written cardinal words and counts whole and fractional digits. Pass any integer or float to get the spelled-out text along with digit counts and locale information."
version: 1.2.5
homepage: https://apiverve.com/marketplace/numbertowords?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/numbertowords-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
